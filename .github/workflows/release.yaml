name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  release-please:
    name: Release please
    runs-on: zon-ubuntu-general-dind
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Release please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
